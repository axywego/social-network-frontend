<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coova — социальная сеть</title>
    <script>
      // Resolve the theme before first paint, otherwise the app boots in
      // the default palette and visibly repaints into the stored one.
      // `system` (and any unrecognised value) resolves to the OS
      // preference. Kept in sync with ThemeContext.jsx.
      (function () {
        var KNOWN = ['day', 'night', 'mist', 'peach', 'ocean', 'sunset', 'graphite'];
        var stored = null;
        try {
          stored = localStorage.getItem('coova:theme');
        } catch (e) {}

        var theme = KNOWN.indexOf(stored) > -1
          ? stored
          : (window.matchMedia &&
             window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'night'
            : 'day');

        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
